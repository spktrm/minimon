[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "minimon-jax"
dynamic = ["version"]
description = "A fully-jittable JAX environment that distils Pokemon Showdown into a two-player zero-sum sequential matrix game."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joseph", email = "joseph.twin14@gmail.com" }]
requires-python = ">=3.10"
keywords = ["jax", "reinforcement-learning", "game-theory", "pokemon", "multi-agent", "environment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = [
    "jax>=0.4.30",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "ruff>=0.5",
    "build>=1.2",
    "twine>=5",
]

[project.urls]
Homepage = "https://github.com/spktrm/minimon"
Issues = "https://github.com/spktrm/minimon/issues"

[tool.hatch.version]
path = "src/minimon/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/minimon"]

[tool.hatch.build.targets.sdist]
include = ["src/minimon", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -n 4 --dist loadfile"
markers = ["slow: longer-running statistical tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]
